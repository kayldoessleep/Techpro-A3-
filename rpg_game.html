<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Squad RPG</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0d0d1a; color:#eee; font-family:Arial,sans-serif; min-height:100vh; padding:16px; }
h1 { text-align:center; color:#ffd700; font-size:28px; margin-bottom:8px; text-shadow:0 0 20px #ffd70088; }
h2 { text-align:center; color:#aaa; font-size:14px; margin-bottom:24px; letter-spacing:3px; }
h3 { color:#ffd700; font-size:14px; margin-bottom:10px; letter-spacing:2px; }
.screen { display:none; max-width:900px; margin:0 auto; }
.screen.on { display:block; }
.char-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-bottom:16px; }
@media(min-width:500px){ .char-grid{ grid-template-columns:repeat(4,1fr); } }
.char-card { background:#1a1a2e; border:2px solid #333; border-radius:10px; padding:14px 10px; text-align:center; cursor:pointer; transition:all .2s; }
.char-card:hover { border-color:#ffd700; }
.char-card.sel { border-color:#ffd700; background:#1f1f35; box-shadow:0 0 14px #ffd70044; }
.char-card img { width:70px; height:70px; border-radius:50%; object-fit:cover; border:2px solid #333; display:block; margin:0 auto; }
.char-card .emo { font-size:44px; line-height:70px; width:70px; height:70px; background:#111; border-radius:50%; display:block; margin:0 auto; }
.cname { font-size:11px; font-weight:bold; color:#ffd700; margin-top:8px; }
.ccls { font-size:11px; color:#a855f7; margin:2px 0 6px; }
.cstats { font-size:10px; color:#777; }
.battle-top { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px; }
@media(max-width:480px){ .battle-top{ grid-template-columns:1fr; } }
.side-title { font-size:11px; color:#666; letter-spacing:2px; margin-bottom:8px; }
.fighters { display:flex; flex-wrap:wrap; gap:8px; }
.fighter { background:#111827; border:2px solid #2a2a3a; border-radius:8px; padding:10px 8px; text-align:center; width:120px; flex-shrink:0; transition:all .2s; }
.fighter.my-turn { border-color:#ffd700; box-shadow:0 0 12px #ffd70066; }
.fighter.dead { opacity:.3; filter:grayscale(1); }
.fighter.enemy-card { border-color:#3a1515; }
.fighter.enemy-card.my-turn { border-color:#ff4455; box-shadow:0 0 12px #ff445566; }
.fighter img { width:50px; height:50px; border-radius:50%; object-fit:cover; display:block; margin:0 auto; }
.fighter .emo2 { font-size:32px; line-height:50px; width:50px; height:50px; background:#0d0d1a; border-radius:50%; display:block; margin:0 auto; text-align:center; }
.fname { font-size:9px; font-weight:bold; color:#ffd700; margin:6px 0 2px; }
.fclass { font-size:9px; margin-bottom:5px; }
.bar-row { margin:2px 0; font-size:8px; color:#888; display:flex; justify-content:space-between; }
.bar { height:5px; background:#1a1a1a; border-radius:3px; margin-bottom:1px; overflow:hidden; }
.bar-fill { height:100%; border-radius:3px; transition:width .4s; }
.hp-hi { background:linear-gradient(90deg,#00cc66,#00ff88); }
.hp-mi { background:linear-gradient(90deg,#ff9900,#ffcc00); }
.hp-lo { background:linear-gradient(90deg,#ff3355,#ff6688); }
.mp-fill { background:linear-gradient(90deg,#0066cc,#00aaff); }
.log-box { background:#0a0a14; border:1px solid #222; border-radius:8px; padding:10px; height:120px; overflow-y:auto; font-size:12px; line-height:1.9; margin-bottom:12px; }
.l-dmg { color:#ff6688; } .l-heal { color:#00ff88; } .l-skill { color:#c084fc; } .l-sys { color:#ffd700; font-weight:bold; } .l-enemy { color:#ff9966; }
.action-box { background:#111827; border:1px solid #222; border-radius:10px; padding:14px; }
.turn-title { font-size:13px; font-weight:bold; margin-bottom:10px; }
.btns { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:8px; }
.btn { padding:9px 14px; border:2px solid; border-radius:7px; cursor:pointer; font-size:12px; font-weight:bold; transition:all .15s; background:#111; }
.btn:hover:not(:disabled) { transform:translateY(-2px); opacity:.85; }
.btn:disabled { opacity:.3; cursor:not-allowed; }
.b-skill { border-color:#a855f7; color:#c084fc; }
.b-gold { border-color:#ffd700; color:#ffd700; }
.b-blue { border-color:#00aaff; color:#66ccff; }
.b-green { border-color:#00ff88; color:#66ffbb; }
.b-red { border-color:#ff4455; color:#ff8899; }
.skill-desc { font-size:11px; color:#666; min-height:18px; margin-bottom:8px; }
.target-lbl { font-size:11px; color:#888; margin-bottom:6px; }
.waiting { text-align:center; color:#ff9966; font-size:12px; letter-spacing:3px; padding:10px; animation:blink .8s step-end infinite; }
@keyframes blink{ 0%,100%{opacity:1}50%{opacity:.2} }
.result-box { text-align:center; padding:50px 20px; }
.r-title { font-size:36px; font-weight:bold; margin-bottom:16px; }
.r-vic { color:#ffd700; } .r-def { color:#ff4455; }
.r-sub { font-size:15px; color:#888; margin-bottom:30px; line-height:2; }
.float { position:fixed; pointer-events:none; font-size:20px; font-weight:bold; z-index:9999; animation:floatup 1.1s ease-out forwards; }
@keyframes floatup{ 0%{opacity:1;transform:translateY(0)} 100%{opacity:0;transform:translateY(-70px)} }
</style>
</head>
<body>

<div id="sel" class="screen on">
  <h1>⚔ SQUAD RPG</h1>
  <h2>TURN-BASED BATTLE</h2>
  <h3 style="text-align:center">CHOOSE 2-3 HEROES</h3>
  <div class="char-grid" id="charGrid"></div>
  <div style="text-align:center">
    <div id="selHint" style="color:#888;font-size:13px;margin-bottom:12px">Pick 2 or 3 heroes</div>
    <button class="btn b-gold" id="goBtn" disabled onclick="startGame()">▶ START BATTLE</button>
  </div>
</div>

<div id="bat" class="screen">
  <h1 style="font-size:18px;margin-bottom:12px">⚔ BATTLE — ROUND <span id="roundNum">1</span>/3</h1>
  <div class="battle-top">
    <div><div class="side-title">☠ ENEMIES</div><div class="fighters" id="enemyFighters"></div></div>
    <div><div class="side-title">🛡 YOUR PARTY</div><div class="fighters" id="playerFighters"></div></div>
  </div>
  <div class="log-box" id="logBox"></div>
  <div class="waiting" id="waitMsg" style="display:none">ENEMY IS THINKING...</div>
  <div class="action-box" id="actionBox"></div>
</div>

<div id="res" class="screen">
  <div class="result-box">
    <div class="r-title" id="resTitle"></div>
    <div class="r-sub" id="resSub"></div>
    <button class="btn b-gold" onclick="goSel()">▶ PLAY AGAIN</button>
  </div>
</div>
